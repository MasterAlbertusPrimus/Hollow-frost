<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Frost</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./menu.css">
</head>

<body class="menu-page">

<div class="menu-viewport">
    <div id="menuTrack" class="menu-track">

        <section class="menu-panel menu-panel--home" aria-label="Home">
            <main class="home-screen">
                <div class="mountains" aria-hidden="true">
                    <div class="mountain mountain-back"></div>
                    <div class="mountain mountain-middle"></div>
                    <div class="mountain mountain-front"></div>
                </div>

                <section class="home-content">
                    <h1 class="game-title">HOLLOW FROST</h1>

                    <nav class="main-menu">
                        <button class="menu-button" id="levelsButton" type="button">Levels</button>
                        <a class="menu-button" href="./custom.html">Custom</a>
                        <a class="menu-button" href="./shop.html">Shop</a>
                    </nav>
                </section>
            </main>
        </section>

        <!-- Loaded immediately so the selector is already rendered before the slide. -->
        <section class="menu-panel menu-panel--levels" aria-label="Level Select">
            <iframe
                id="levelsFrame"
                class="menu-frame"
                src="./levels.html"
                title="Hollow Frost level select"
                loading="eager"
            ></iframe>
        </section>

        <!-- Level 1 is preloaded while the player is on the home screen. -->
        <section class="menu-panel menu-panel--game" aria-label="Game">
            <iframe
                id="gameFrame"
                class="menu-frame menu-frame--game"
                src="./game.html?level=1"
                title="Hollow Frost game"
                loading="eager"
            ></iframe>
        </section>
    </div>

    <div id="transitionVeil" class="menu-transition-veil"></div>
</div>

<script>
(function () {
    'use strict';

    var track = document.getElementById('menuTrack');
    var levelsFrame = document.getElementById('levelsFrame');
    var gameFrame = document.getElementById('gameFrame');
    var levelsButton = document.getElementById('levelsButton');
    var veil = document.getElementById('transitionVeil');

    var currentPanel = 'home';
    var currentGameLevel = 1;
    var pendingStart = false;

    function origin() {
        return window.location.origin;
    }

    function setPanel(panel) {
        currentPanel = panel;
        track.classList.remove('show-levels', 'show-game');

        if (panel === 'levels') track.classList.add('show-levels');
        if (panel === 'game') track.classList.add('show-game');
    }

    function softTransition(callback) {
        veil.classList.add('active');
        window.setTimeout(function () {
            callback();
            window.setTimeout(function () {
                veil.classList.remove('active');
            }, 80);
        }, 90);
    }

    function startLevel(level) {
        level = Number.parseInt(level, 10);
        if (!Number.isFinite(level) || level < 1) return;

        var unlocked = 1;
        try {
            unlocked = Math.max(1, Number.parseInt(localStorage.getItem('hollow_frost_unlocked_level') || '1', 10));
        } catch (error) {}

        if (level > unlocked) return;

        pendingStart = true;

        /*
         * If the requested level isn't already in the hidden game frame,
         * load it while the selector is still visible. The slide happens
         * only after the iframe has had a chance to initialize.
         */
        if (currentGameLevel !== level) {
            currentGameLevel = level;
            gameFrame.src = './game.html?level=' + encodeURIComponent(level);
        }

        softTransition(function () {
            setPanel('game');
            sendStartWhenReady(level);
        });
    }

    function sendStartWhenReady(level) {
        var attempts = 0;

        function send() {
            attempts++;
            try {
                gameFrame.contentWindow.postMessage({
                    type: 'hollow-frost-start-level',
                    level: level
                }, origin());
            } catch (error) {}

            if (attempts < 30 && pendingStart) {
                window.setTimeout(send, 150);
            }
        }

        send();
    }

    function returnToLevels() {
        pendingStart = false;
        softTransition(function () {
            setPanel('levels');
        });
    }

    levelsButton.addEventListener('click', function () {
        softTransition(function () {
            setPanel('levels');
        });
    });

    window.addEventListener('message', function (event) {
        if (event.origin !== origin()) return;
        if (event.source !== levelsFrame.contentWindow && event.source !== gameFrame.contentWindow) return;
        if (!event.data || typeof event.data !== 'object') return;

        if (event.source === levelsFrame.contentWindow) {
            if (event.data.type === 'hollow-frost-start-level') {
                startLevel(event.data.level);
            } else if (event.data.type === 'hollow-frost-back-home') {
                softTransition(function () {
                    setPanel('home');
                });
            }
        }

        if (event.source === gameFrame.contentWindow) {
            if (event.data.type === 'hollow-frost-level-complete') {
                pendingStart = false;

                /*
                 * Preload the next level before the selector becomes visible.
                 * This is the important part: the next game's fetch/initialization
                 * happens while the player is looking at the level select.
                 */
                if (event.data.nextLevel) {
                    currentGameLevel = Number(event.data.nextLevel);
                    gameFrame.src = './game.html?level=' + encodeURIComponent(currentGameLevel);
                }

                softTransition(function () {
                    setPanel('levels');
                    levelsFrame.contentWindow.postMessage({
                        type: 'hollow-frost-refresh-levels'
                    }, origin());
                });
            }
        }
    });

    gameFrame.addEventListener('load', function () {
        if (!pendingStart) return;

        var match = gameFrame.src.match(/[?&]level=(\d+)/);
        var level = match ? Number.parseInt(match[1], 10) : currentGameLevel;
        sendStartWhenReady(level);
    });
})();
</script>

</body>
</html>
