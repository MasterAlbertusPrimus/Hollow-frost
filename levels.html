<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Levels — Hollow Frost</title><link rel="stylesheet" href="./style.css"><style>
.level-select{position:relative;z-index:20;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:hidden}.level-select:before{content:"";position:absolute;width:55vw;height:55vw;max-width:700px;max-height:700px;border-radius:50%;background:radial-gradient(circle,rgba(115,215,255,.12),transparent 68%);animation:selectorGlow 7s ease-in-out infinite alternate;pointer-events:none}.level-header{position:relative;text-align:center;margin-bottom:24px;animation:selectorHeaderFloat 6s ease-in-out infinite}.level-kicker{margin:0 0 7px;color:rgba(164,224,255,.72);font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}.level-header h1{margin:0;font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:.12em;font-weight:950;text-shadow:0 8px 30px rgba(0,0,0,.35),0 0 35px rgba(100,210,255,.16)}.selector-shell{position:relative;width:min(900px,calc(100vw - 48px));display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:18px}.selector-arrow{width:64px;height:64px;border:1px solid rgba(153,222,255,.32);border-radius:18px;background:linear-gradient(145deg,rgba(22,70,102,.82),rgba(5,29,52,.88));color:#eaf8ff;font-size:29px;cursor:pointer;box-shadow:0 14px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);animation:arrowFloat 5.2s ease-in-out infinite;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}.selector-arrow:nth-child(3){animation-delay:-2.6s}.selector-arrow:hover{transform:translateY(-4px) scale(1.04);border-color:rgba(165,229,255,.72);box-shadow:0 18px 42px rgba(0,0,0,.28),0 0 28px rgba(92,203,255,.12)}.selector-arrow:active{transform:translateY(0) scale(.96)}.level-card{position:relative;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px;border:1px solid rgba(153,222,255,.34);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(115,216,255,.15),transparent 48%),linear-gradient(145deg,rgba(15,55,84,.91),rgba(5,24,44,.94));box-shadow:0 28px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08);animation:cardFloat 6.5s ease-in-out infinite;transition:transform .35s ease,opacity .25s ease}.level-card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,rgba(196,239,255,.09) 50%,transparent 72%);transform:translateX(-120%);animation:cardSheen 6s ease-in-out infinite;pointer-events:none}.level-preview{position:relative;width:min(100%,590px);height:130px;border-radius:18px;overflow:hidden;border:1px solid rgba(158,225,255,.18);background:linear-gradient(180deg,rgba(52,124,165,.25),transparent 60%),radial-gradient(circle at 72% 38%,rgba(175,235,255,.28) 0 2px,transparent 3px),linear-gradient(135deg,#0b2944,#061728);box-shadow:inset 0 0 45px rgba(0,0,0,.28)}.level-preview:before,.level-preview:after{content:"";position:absolute;left:-10%;width:120%;height:75%;clip-path:polygon(0 100%,0 62%,14% 44%,26% 66%,39% 30%,53% 60%,68% 36%,81% 65%,100% 42%,100% 100%);background:rgba(45,133,177,.32);animation:previewMountains 13s ease-in-out infinite alternate}.level-preview:before{bottom:-15px}.level-preview:after{bottom:-28px;opacity:.55;animation-duration:18s;animation-delay:-5s}.level-number-large{position:absolute;left:18px;top:14px;z-index:2;font-size:12px;font-weight:900;letter-spacing:.2em;color:rgba(218,246,255,.78)}.level-lock{position:absolute;right:18px;top:14px;z-index:2;font-size:17px;opacity:.75}.level-info{text-align:center;position:relative;z-index:2}.level-info h2{margin:7px 0;font-size:clamp(24px,4vw,38px);letter-spacing:.04em}.level-difficulty{color:#83d8ff;font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}.progress-track{width:min(300px,80%);height:6px;margin:13px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.progress-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#65 </style></head><body class="menu-page"><main class="levels-screen"><div class="mountains" aria-hidden="true"><div class="mountain mountain-back"></div><div class="mountain mountain-middle"></div><div class="mountain mountain-front"></div></div><a id="backButton" class="back-button" href="./index.html">← Back</a><section class="level-select"><header class="level-header"><p class="level-kicker">Hollow Frost</p><h1>LEVELS</h1></header><div class="selector-shell"><button id="previousButton" class="selector-arrow" type="button" aria-label="Previous level">‹</button><article id="levelCard" class="level-card"><div class="level-preview"><span id="levelNumber" class="level-number-large">LEVEL 01</span><span id="levelLock" class="level-lock">◆</span></div><div class="level-info"><div id="difficulty" class="level-difficulty">FROSTBOUND</div><h2 id="levelName">Hollow Frost</h2><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div><button id="playButton" class="play-button" type="button">Play</button></article><button id="nextButton" class="selector-arrow" type="button" aria-label="Next level">›</button></div><footer class="selector-footer"><div id="levelDots" class="level-dots" aria-hidden="true"></div></footer></section></main><script>(function(){'use strict';var LEVELS=[{number:1,name:'Hollow Frost',difficulty:'Frostbound'},{number:2,name:'Rimefall Passage',difficulty:'Chilled'}],KEY='hollow_frost_unlocked_level',selected=1,card=document.getElementById('levelCard'),numberEl=document.getElementById('levelNumber'),lockEl=document.getElementById('levelLock'),nameEl=document.getElementById('levelName'),difficultyEl=document.getElementById('difficulty'),play=document.getElementById('playButton'),fill=document.getElementById('progressFill'),dots=document.getElementById('levelDots'),prev=document.getElementById('previousButton'),next=document.getElementById('nextButton'),back=document.getElementById('backButton');function unlocked(){try{var n=Number.parseInt(localStorage.getItem(KEY)||'1',10);return Number.isFinite(n)&&n>0?n:1}catch(e){return 1}}function save(n){try{localStorage.setItem(KEY,String(Math.max(1,n)))}catch(e){}}function renderDots(){dots.innerHTML='';LEVELS.forEach(function(l){var d=document.createElement('span');d.className='level-dot'+(l.number===selected?' active':'');dots.appendChild(d)})}function render(){var l=LEVELS[selected-1],u=unlocked(),ok=l.number<=u;numberEl.textContent='LEVEL '+String(l.number).padStart(2,'0');nameEl.textContent=l.name;difficultyEl.textContent=l.difficulty;lockEl.textContent=ok?'◆':'🔒';play.textContent=ok?'Play':'Locked';play.disabled=!ok;fill.style.width=ok?'100%':'0%';card.classList.toggle('locked-card',!ok);prev.disabled=selected<=1;next.disabled=selected>=LEVELS.length;prev.style.opacity=selected<=1?'.32':'1';next.style.opacity=selected>=LEVELS.length?'.32':'1';renderDots()}function select(n){n=Math.max(1,Math.min(LEVELS.length,n));if(n===selected)return;card.style.opacity='0';card.style.transform='scale(.985)';setTimeout(function(){selected=n;render();card.style.opacity='';card.style.transform=''},110)}function start(){if(selected>unlocked())return;if(window.parent!==window){window.parent.postMessage({type:'hollow-frost-start-level',level:selected},window.location.origin)}else{location.href='./game.html?level='+selected}}prev.onclick=function(){select(selected-1)};next.onclick=function(){select(selected+1)};play.onclick=start;back.onclick=function(e){if(window.parent!==window){e.preventDefault();window.parent.postMessage({type:'hollow-frost-back-home'},window.location.origin)}};window.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')select(selected-1);if(e.key==='ArrowRight')select(selected+1);if(e.key==='Enter')start();if(e.key==='Escape')back.click()});window.addEventListener('message',function(e){if(e.origin!==window.location.origin||e.source!==window.parent)return;if(e.data&&e.data.type==='hollow-frost-refresh-levels'){if(Number.isFinite(Number(e.data.unlockedLevel)))save(Number(e.data.unlockedLevel));selected=Math.min(unlocked(),LEVELS.length);render()}});selected=Math.min(unlocked(),LEVELS.length);render()})();</script></body></html>
